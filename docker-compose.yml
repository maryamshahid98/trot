# Development: `docker compose up -d` starts only the database (the API runs on your machine with `npm start`).
# Full stack in containers: `docker compose --profile app up --build -d`  (needs JWT_SECRET and APP_DB_PASSWORD in .env).
# Production: see docs/deployment.md. The values below are DEVELOPMENT defaults and must not be used as they are.
services:
  db:
    image: postgres:16
    container_name: trot-db
    environment:
      POSTGRES_USER: trot          # superuser, used only by the migration runner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trot}
      POSTGRES_DB: trot
    ports:
      - "5432:5432"                # development only: in production do not publish the database port
    volumes:
      - trot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trot -d trot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The database starts EMPTY. Create the tables with: npm run db:migrate (in apps/api), or see docs/deployment.md.

  # A free S3-compatible service for development only, so file storage can be tried without an Amazon account:
  #   docker compose --profile s3 up -d      (it listens on this computer only and accepts any key: never use it in production)
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.55
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - trot-s3:/data

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true                     # forwards stop signals, so the API shuts down cleanly
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://trot_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/trot
      # Used only by the one-off migration command, never by the running API.
      ADMIN_DATABASE_URL: postgres://trot:${POSTGRES_PASSWORD:-trot}@db:5432/trot
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    volumes:
      - trot-uploads:/data/uploads   # uploaded rider documents: back this volume up with the database

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The address your BROWSER uses to reach the API. It is built into the site.
        VITE_API_URL: ${WEB_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    # The API must allow this address: add http://localhost:8080 to CORS_ORIGINS in .env.

volumes:
  trot-data:
  trot-uploads:
  trot-s3:
